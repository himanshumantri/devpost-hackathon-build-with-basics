services:
  - type: web
    name: checkdin-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/airports
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: CORS_ORIGINS
        sync: false # set in the Render dashboard to your Vercel address
